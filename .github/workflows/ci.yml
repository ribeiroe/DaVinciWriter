name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r web/requirements.txt pytest

      - name: Compile check
        run: python -m py_compile web/app.py web/davinci_core.py

      - name: Claude Code wrappers in sync
        run: python scripts/sync-claude.py --check

      - name: Frontmatter lint
        run: python scripts/lint-prompts.py

      - name: Run tests
        run: pytest tests/ -v
